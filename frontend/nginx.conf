# Dùng resolver DNS nội bộ của Docker (127.0.0.11) + biến $backend_upstream
# thay vì proxy_pass http://backend:3000 trực tiếp: proxy_pass với hostname
# tĩnh chỉ phân giải DNS 1 LẦN lúc nginx khởi động rồi cache IP đó mãi mãi.
# Nếu lúc đó DNS trả sai/chưa sẵn sàng, nginx sẽ kẹt vĩnh viễn với IP sai
# (đúng triệu chứng "connect() failed Connection refused" gặp phải). Dùng
# biến ép nginx phân giải lại theo TTL bên dưới thay vì cache 1 lần.
resolver 127.0.0.11 valid=5s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    # SPA: mọi route không khớp file tĩnh -> trả về index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
